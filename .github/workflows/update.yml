name: Update showtimes

# Everything runs on GitHub; nothing depends on a personal computer.
#   Daily at 3:07 am Denver time and "Run workflow": scrape -> commit the data -> publish the site.
#   Pushes to main: publish the site without scraping.
#   Pull requests: run the tests and a scrape that writes nothing, proving every theater source
#     still answers from GitHub's network before a change merges.
# A push made with GITHUB_TOKEN doesn't trigger workflows, so the data commit can't loop, which
# is also why publishing is a job in this workflow rather than a reaction to that push.
on:
  # Daily at 3:07 am Denver time. Cron is UTC and Denver shifts between MDT (UTC-6) and MST (UTC-7),
  # so both candidate times are scheduled and the `gate` job lets through only the one that is
  # 3:07 am locally that day. Off the hour on purpose: GitHub delays runs scheduled at :00.
  # 3 am, not later, because GitHub starts scheduled runs late (5:20 am ran ~10:50 am in Nov 2026);
  # a late start still finishes by the morning.
  schedule:
    - cron: "7 9 * * *"       # 3:07 am MDT (summer)
    - cron: "7 10 * * *"      # 3:07 am MST (winter)
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config.toml"
      - "pyproject.toml"
      - "public/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: pytest

      - name: Scrape every theater from GitHub's network (writes nothing)
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}       # matching, release dates, popularity
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}   # IMDb ratings, Metacritic
        run: python -m movie_scraper --dry-run --summary "$GITHUB_STEP_SUMMARY"

  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          # "Run workflow" always goes. A scheduled run goes only if its cron matches Denver's
          # current UTC offset (-0600 in summer, -0700 in winter); this survives late starts.
          offset=$(TZ=America/Denver date +%z)
          if [ -z "$CRON" ] || { [ "$CRON" = "7 9 * * *" ] && [ "$offset" = "-0600" ]; } \
             || { [ "$CRON" = "7 10 * * *" ] && [ "$offset" = "-0700" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: the other daily slot is 3:07 am Denver time today (offset $offset)."
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      outcome: ${{ steps.scrape.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      # A failed theater keeps its last published showtimes, so the data below is still worth
      # publishing. The alert job fails the run afterward, which is what triggers GitHub's email.
      - name: Scrape every theater
        id: scrape
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}       # matching, release dates, popularity
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}   # IMDb ratings, Metacritic
        run: python -m movie_scraper --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit the refreshed data
        run: |
          git add public/data.json known_titles.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update showtimes $(TZ=America/Denver date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: scrape
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.scrape.result == 'success'
          || (needs.scrape.result == 'skipped' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # includes the data commit the scrape job just pushed

      - uses: actions/configure-pages@v5
        id: pages

      - name: Inject site URL + per-deploy asset version (cache-busting)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          url="${SITE_URL%/}/"
          sed -i "s#__SITE_URL__#${url}#g" public/index.html
          # Bust app.js/styles.css caches on every deploy so frontend changes show immediately.
          sed -i "s#__ASSET_VERSION__#$(git rev-parse HEAD)#g" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deploy

  alert:
    needs: [scrape, deploy]
    if: always() && needs.scrape.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::A theater failed to scrape, or the scraper crashed. The site kept its last good data; see the summary on the scrape job."
          exit 1
