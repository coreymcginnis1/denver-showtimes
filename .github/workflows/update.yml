name: Update showtimes

# Everything runs on GitHub; nothing depends on a personal computer.
#   Daily from 3:07 am Denver time and "Run workflow": scrape -> commit the data -> publish the site.
#   Pushes to main: publish the site without scraping.
#   Pull requests: run the tests and a scrape that writes nothing, proving every theater source
#     still answers from GitHub's network before a change merges.
# A push made with GITHUB_TOKEN doesn't trigger workflows, so the data commit can't loop, which
# is also why publishing is a job in this workflow rather than a reaction to that push.
on:
  # Daily from 3:07 am Denver time, with hourly backups. GitHub starts scheduled runs late (5:20 am
  # ran ~10:50 am on Nov 7 and 8, 2026) and sometimes not at all (Nov 9), so there's an attempt
  # every hour from 09:07 to 16:07 UTC: 3:07-10:07 am MDT in summer, 2:07-9:07 am MST in winter.
  # The `gate` job lets through the first attempt that is past 3 am in Denver on a day main has no
  # "Update showtimes <today>" commit yet; the rest skip. Off the hour: GitHub delays :00 runs.
  schedule:
    - cron: "7 9-16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config.toml"
      - "pyproject.toml"
      - "public/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: pytest

      - name: Scrape every theater from GitHub's network (writes nothing)
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}       # matching, release dates, popularity
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}   # IMDb ratings, Metacritic
        run: python -m movie_scraper --dry-run --summary "$GITHUB_STEP_SUMMARY"

      - name: TEST ONLY (draft PR) critic scores in Wikipedia articles
        run: python scripts/critics_coverage_test.py public/data.json

  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # "Run workflow" always goes. A scheduled attempt goes only after 3 am Denver time and only
          # if today's data commit isn't on main yet (an earlier attempt or a manual run made it).
          today=$(TZ=America/Denver date +%F); hour=$(TZ=America/Denver date +%-H)
          last=$(gh api "repos/$REPO/commits?sha=main&path=public/data.json&per_page=1" --jq '.[0].commit.message' | head -n1)
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 3 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skipping: before 3 am in Denver."
          elif [ "$last" = "Update showtimes $today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skipping: today's showtimes are already on main."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      outcome: ${{ steps.scrape.outcome }}
      done: ${{ steps.again.outputs.done }}
    steps:
      # Two late attempts can pass the gate together; this job runs one at a time (concurrency),
      # so the second checks again here and stops if the first has already updated today.
      - id: again
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh api "repos/$REPO/commits?sha=main&path=public/data.json&per_page=1" --jq '.[0].commit.message' | head -n1)
          if [ "$EVENT" = "schedule" ] && [ "$last" = "Update showtimes $(TZ=America/Denver date +%F)" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "Skipping: another attempt already updated today."
          fi

      - uses: actions/checkout@v4
        if: steps.again.outputs.done != 'true'

      - uses: actions/setup-python@v5
        if: steps.again.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .
        if: steps.again.outputs.done != 'true'

      # A failed theater keeps its last published showtimes, so the data below is still worth
      # publishing. The alert job fails the run afterward, which is what triggers GitHub's email.
      - name: Scrape every theater
        id: scrape
        if: steps.again.outputs.done != 'true'
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}       # matching, release dates, popularity
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}   # IMDb ratings, Metacritic
        run: python -m movie_scraper --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit the refreshed data
        if: steps.again.outputs.done != 'true'
        run: |
          git add public/data.json known_titles.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update showtimes $(TZ=America/Denver date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: scrape
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && ((needs.scrape.result == 'success' && needs.scrape.outputs.done != 'true')
          || (needs.scrape.result == 'skipped' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # includes the data commit the scrape job just pushed

      - uses: actions/configure-pages@v5
        id: pages

      - name: Inject site URL + per-deploy asset version (cache-busting)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          url="${SITE_URL%/}/"
          sed -i "s#__SITE_URL__#${url}#g" public/index.html
          # Bust app.js/styles.css caches on every deploy so frontend changes show immediately.
          sed -i "s#__ASSET_VERSION__#$(git rev-parse HEAD)#g" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deploy

  alert:
    needs: [scrape, deploy]
    if: always() && needs.scrape.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::A theater failed to scrape, or the scraper crashed. The site kept its last good data; see the summary on the scrape job."
          exit 1
