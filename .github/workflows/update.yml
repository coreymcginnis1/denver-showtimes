name: Scrape showtimes & deploy

on:
  schedule:
    - cron: "0 12 * * *"      # ~06:00 America/Denver (MDT). 12:00 UTC daily.
  workflow_dispatch:            # lets you run it on demand from the Actions tab
  push:
    branches: [main]            # redeploy when you change the site or scraper

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - uses: actions/configure-pages@v5
        id: pages

      - name: Scrape showtimes -> public/data.json
        run: python -m movie_scraper

      - name: Inject site URL into Open Graph tags
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import os, pathlib
          url = (os.environ.get("SITE_URL") or "").rstrip("/") + "/"
          p = pathlib.Path("public/index.html")
          p.write_text(p.read_text(encoding="utf-8").replace("__SITE_URL__", url), encoding="utf-8")
          print("Injected SITE_URL =", url)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deploy
