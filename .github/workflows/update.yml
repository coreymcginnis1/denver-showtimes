name: Deploy showtimes site

# Deploy-only: publishes the committed public/ (incl. data.json). Scraping runs locally
# (see scripts/update.ps1) because AMC blocks GitHub's datacenter IPs — your home IP works.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Inject site URL into Open Graph tags
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          url="${SITE_URL%/}/"
          sed -i "s#__SITE_URL__#${url}#g" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deploy
