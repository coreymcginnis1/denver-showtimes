# Configuration for the Denver showtimes scraper.
# The weekly GitHub Action runs `python -m movie_scraper` with these settings.

timezone = "America/Denver"
days_ahead = 14                  # rolling window: today .. today + days_ahead
ahead_days = 90                  # Sie, Landmark and Alamo: everything this far out (cheap for them)
output = "public/data.json"      # where the frontend reads from
default_runtime_minutes = 120    # fallback event length when a film's runtime is unknown

[theaters.sie]
enabled = true
name = "Sie FilmCenter"
color = "#E4572E"                # used to color events in the calendar
lat = 39.7397
lon = -104.957

[theaters.landmark]
enabled = true
name = "Landmark Mayan"
color = "#17BEBB"
lat = 39.7187
lon = -104.9871

[theaters.amc]
enabled = true
default_on = false
name = "AMC 9+CO 10"
color = "#2E5EAA"
scraper = "fandango"
location = "AAYUA"                # Fandango theater id
lat = 39.7296
lon = -104.9412
site = "https://www.amctheatres.com/movie-theatres/denver"

# `site`: the theater's own page, offered as "Or buy from AMC directly" next to Fandango's link. Where
# the chain blocks automated checks and no search result confirmed the theater's page (several AMCs,
# Regal River Point, Harkins' JavaScript-only site), it's the chain's Denver / theater list instead.
# --- Secondary theaters: scraped but their filter chip starts OFF (default_on = false). ---
# They occasionally carry indies/70mm/IMAX you can't find at the three above; readers opt in by
