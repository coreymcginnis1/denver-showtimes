# Configuration for the Denver showtimes scraper.
# Edit and re-run `python -m movie_scraper` (or let the daily GitHub Action run it).

timezone = "America/Denver"
days_ahead = 14                  # rolling window: today .. today + days_ahead
output = "public/data.json"      # where the frontend reads from
default_runtime_minutes = 120    # fallback event length when a film's runtime is unknown

[theaters.sie]
enabled = true
name = "Sie FilmCenter"
color = "#E4572E"                # used to color events in the calendar

[theaters.landmark]
enabled = true
name = "Landmark Mayan"
color = "#17BEBB"

[theaters.amc]
enabled = true
name = "AMC 9+CO 10"
color = "#2E5EAA"
location = "denver/amc-9-co-10"   # path under amctheatres.com/movie-theatres/<...>/showtimes

# --- Secondary theaters: scraped but their filter chip starts OFF (default_on = false). ---
# They occasionally carry indies/70mm/IMAX you can't find at the three above; readers opt in
# by clicking the chip. `scraper` points at the class to reuse; `location` is its theatre id.

[theaters.amc_westminster]
enabled = true
default_on = false
name = "AMC Westminster Promenade 24"
color = "#6C5CE7"
scraper = "amc"
location = "denver/amc-westminster-promenade-24"   # the "denver" metro segment is required

[theaters.alamo_sloans]
enabled = true
default_on = false
name = "Alamo Drafthouse Sloans Lake"
color = "#E0A458"
scraper = "alamo"
location = "sloans-lake"

# Regal's own site is Cloudflare-gated (today-only), so these read from Fandango instead —
# Regal sells via Fandango, whose napi JSON is plain httpx. `location` is the Fandango theater id.
[theaters.regal_colorado]
enabled = true
default_on = false
name = "Regal UA Colorado Center & IMAX"
color = "#C44E9D"
scraper = "fandango"
location = "AAFXW"

[theaters.regal_pavilions]
enabled = true
default_on = false
name = "Regal UA Denver Pavilions"
color = "#4C9F70"
scraper = "fandango"
location = "AAJJG"

# Title standardization: strip repertory/event series labels from the START of a
# film title (the label plus its ":" / "–" / "-" separator), so e.g.
# "Bleak Week: Gummo" -> "Gummo" and "Fan Faves: Michael" -> "Michael".
# Real titles with colons (e.g. "Star Wars: The Mandalorian and Grogu") are kept.
# Case-insensitive regex; TOML literal strings (single quotes) keep backslashes literal.
[titles]
strip_prefixes = [
  'Bleak Week',
  'Sie/?Saw',
  'Sci-?Fi Film Series(?:\s*#\d+)?',
  'Members?\s+Only[^:]*',
  'Fan Faves',
  'Staff Pick',
  'The Popcorn List',          # "The Popcorn List: The Fisherman" -> "The Fisherman"
]
# Event descriptors stripped from the END of a title (label + separator).
# e.g. "Sleepaway Camp: The Midnight Mass Experience" -> "Sleepaway Camp".
strip_suffixes = [
  '\s+w/\s+.*$',
  ':\s+.*\bExperience$',
  '\s+Fan First Screenings?$',
  '\s*\(\d{4}\)$',                                       # release year: "Moana (2026)" -> "Moana"
  '\s*[-–—]?\s*\d{1,3}(?:st|nd|rd|th)\s+Anniversary$',   # "Citizen Kane 85th Anniversary"
  '\s*[-–—]\s*Studio Ghibli Fest(?:ival)?(?:\s+\d{4})?$',  # "... - Studio Ghibli Fest 2026"
  '\s+(?:IMAX\s+)?(?:Opening Night\s+)?Fan Event$',      # "MOANA IMAX Opening Night Fan Event"
  '\s+(?:IMAX\s+)?(?:Early Access|Advance)\s+Screenings?$',  # "... Early Access Screening"
  '\s+on\s+\d{2,3}\s?mm$',      # format tag in title: "Interstellar on 35mm" -> "Interstellar"
  '\s*[:–—-]\s*Xfinity\b.*$',   # sponsor tag: "Minions & Monsters: Xfinity" -> "Minions & Monsters"
]
# Titles matching any of these are dropped entirely — events that aren't a specific
# movie (mystery screenings, watch parties, etc.). Case-insensitive regex.
drop = [
  'Screen Unseen',
  'GOLAZO',
  'Watch Part(?:y|ies)',
  'Tokusatsu',
  'Private Theatre Rental',   # AMC private-booking options, not public screenings
  'Copa Mundial',             # FIFA World Cup watch parties (Telemundo), not films
  'Apple TV Live',            # live sports broadcasts: "F1 on Apple TV Live in IMAX: ..."
  'Memorial Screening',       # tribute events with no film named
  'Mystery Movie',            # surprise screenings, no film named ("REGAL: Monday Mystery Movie")
  '\bUFC \d',                 # live UFC pay-per-view broadcasts ("UFC 329: ..."), not films
]

# Which films are pre-checked when the page first loads (others start unchecked but
# available to toggle on). Case-insensitive regex matched against the normalized title.
# Leave the list empty to pre-select ALL films (the long default). Edit to taste.
[defaults]
films = [
  'Backrooms',
  'I Love Boosters',
  'Tuner',
  'The Invite',
  'Disclosure Day',
]

# Optional filters. Omit/comment out a key to disable that filter.
# Leaving the whole section empty includes every showtime.
[filters]
# title_include = ["Dune", "Oppenheimer"]   # keep only titles matching any (case-insensitive) regex
# title_exclude = ["Sing-Along"]            # drop titles matching any regex
# weekdays = ["Fri", "Sat", "Sun"]          # keep only these weekdays
# earliest = "17:00"                         # keep only showtimes at/after this local time
# latest = "23:59"                           # keep only showtimes at/before this local time
