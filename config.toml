# Title standardization: strip repertory/event series labels from the START of a
# film title (the label plus its ":" / "–" / "-" separator), so e.g.
# "Bleak Week: Gummo" -> "Gummo" and "Fan Faves: Michael" -> "Michael".
# Real titles with colons (e.g. "Star Wars: The Mandalorian and Grogu") are kept.
# Case-insensitive regex; TOML literal strings (single quotes) keep backslashes literal.
[titles]
strip_prefixes = [
  'Bleak Week',
  'Sie/?Saw',
  'Sci-?Fi Film Series(?:\s*#\d+)?',
  'Scream Screen',             # Sie horror series: "Scream Screen: Idle Hands" -> "Idle Hands"
  'Fan Faves',
  'Staff Pick',
  'The Popcorn List',          # "The Popcorn List: The Fisherman" -> "The Fisherman"
  'Crunchyroll(?:\s+Anime\s+Nights?)?',   # "Crunchyroll Anime Nights: Dive In Wonderland"
  '(?:\w+\s+)?Dose of Reality(?:\s+Screening)?',  # Sie doc series: "Big Dose of Reality Screening: X"
  '[^:]{2,40}?\s+Presents',   # presenter labels: "Sight & Sound Presents: Joshua Live!"
  'Friday Night Weird',        # Dairy series: "Friday Night Weird: These People" -> "These People"
  'Cinema Classics(?:\s+with\s+[^:]{2,40}?)?',   # Dairy: "Cinema Classics with Jeffrey Kash: Modern Times"
  'Film Screening',            # CU calendar: "Film Screening: Little Amélie or the Character of Rain"
]
# Event descriptors stripped from the END of a title (label + separator).
# e.g. "Sleepaway Camp: The Midnight Mass Experience" -> "Sleepaway Camp".
strip_suffixes = [
  '\s+w/\s+.*$',
  '\s*[-–—:]?\s*\(?(?:New\s+)?[248]K\s+(?:Restoration|Restored|Remaster(?:ed)?)\)?$',   # "The Host 4K Restoration" / "(4K Restoration)"
  '\s*\((?:Newly\s+)?(?:Restored|Restoration|Remastered)\)$',   # "Suspiria (Restored)"
  '\s+[-–—]\s+[^-–—]*\bin person!?$',     # guests: "Elevation - Anthony Mackie and George Nolfi in person!"
  '\s+[-–—]\s+Part of\s.+$',              # festivals: "Breathless - Part of the Albertine ... Festival"
  '\s+[-–—]\s+Free\s+(?:Show|Screening)$',   # "Whiplash - FREE SHOW"
  '\s+[-–—]\s+IFS Underground$',          # CU IFS late-night series: "Café Flesh - IFS Underground"
  ':\s+.*\bExperience$',
  '\s+Fan First Screenings?$',
  '\s*\(\d{4}\)$',                                       # release year: "Moana (2026)" -> "Moana"
  '\s*[-–—:]?\s*\(?\d{1,3}(?:st|nd|rd|th)\s+Anniversary\)?$',  # "85th Anniversary" / ": 10th Anniversary"
  '\s*[-–—:]?\s*\(?(?:Director\W?s|Extended|Theatrical|Final|Uncut)\s+Cut\)?$',  # "- Directors Cut" / "(Director's Cut)" -> base film
  '\s*[:–—-]\s*[^:]*\bEdition$',   # "Backrooms: Everything Must Go Edition" -> "Backrooms"
  '\s*[-–—]\s*(?:Promo|Preview|Sneak(?:\s+Preview)?)\s+Screenings?$',   # "... - Promo Screening"
  '\s*[-–—]\s*Studio Ghibli Fest(?:ival)?(?:\s+\d{4})?$',  # "... - Studio Ghibli Fest 2026"
  '\s+(?:IMAX\s+)?(?:Opening Night\s+)?Fan Event$',      # "MOANA IMAX Opening Night Fan Event"
  '\s+(?:IMAX\s+)?(?:Early Access(?:\s+Screenings?)?|Advance\s+Screenings?)$',  # "... Early Access [Screening]"
  '\s*[-–—:]\s*Super Ticket$',                          # ticket bundles: "The Hunger Games: ... - Super Ticket"
  '\s*[-–—:]?\s*\(?\b(?:Re-?release|Re-?issue|RE\d{2})\)?$',  # "Coraline Re-release" / "Dune: Part One Reissue" / "(RE26)"
  '\s+(?:on|in)\s+(?:\d{2,3}\s?mm|VistaVision)(?:\s+film)?$',   # "Interstellar on 35mm" / "... in 70mm" / "... in VistaVision"
  '\s*[:–—-]\s*Sensory[- ]?Friendly\b.*$',  # "Supergirl: Sensory Friendly Screening" -> "Supergirl"
  '\s*\(dir\.?\s[^)]*\)$',      # director annotation: "Alpha (dir. Rawail)" -> "Alpha"
  '\s*[:–—-]\s*Xfinity\b.*$',   # sponsor tag: "Minions & Monsters: Xfinity" -> "Minions & Monsters"
  '\s*[-–—:]?\s+Encore$',       # rebroadcasts: "The Metropolitan Opera: Carmen Encore" -> "... Carmen"
  '\s*\((?:\d{4}\s+)?Encore\)$',
  '\s*\((?:English|Spanish|Hindi|Telugu|Tamil|Malayalam|Kannada|Punjabi|Japanese|Korean)(?:\s+(?:\d{4}|Dub(?:bed)?|Sub(?:titled)?|Version))?\)$',  # language versions: "Ramayana (English 2026)"  # "... Carmen (2026 Encore)" -> "... Carmen"
]
# Titles matching any of these are dropped entirely — events that aren't a specific
# movie (mystery screenings, watch parties, etc.). Case-insensitive regex.
drop = [
  'Screen Unseen',
  'GOLAZO',
  'Watch Part(?:y|ies)',
  'Tokusatsu',
  'Private Theatre Rental',   # AMC private-booking options, not public screenings
  'Copa Mundial',             # FIFA World Cup watch parties (Telemundo), not films
  'Apple TV Live',            # live sports broadcasts: "F1 on Apple TV Live in IMAX: ..."
  'Memorial Screening',       # tribute events with no film named
  'Mystery Movie',            # surprise screenings, no film named ("REGAL: Monday Mystery Movie")
  '^IFS Underground$',        # CU IFS late-night series with no film named
  'Secret (?:Cinema|Movie)',  # mystery screenings, no film named (Harkins Secret Cinema, Cinemark Secret Movie Series)
  '\bUFC \d',                 # live UFC pay-per-view broadcasts ("UFC 329: ..."), not films
  'Members?\s+Only',          # members-only screenings (public can't attend) — drop them
  'League of Legends',        # live esports broadcasts ("League of Legends Worlds 26 - Finals")
  '\bE-?sports?\b',
]

# Optional filters. Omit/comment out a key to disable that filter.
# Leaving the whole section empty includes every showtime.
[filters]
# title_include = ["Dune", "Oppenheimer"]   # keep only titles matching any (case-insensitive) regex
# title_exclude = ["Sing-Along"]            # drop titles matching any regex
# weekdays = ["Fri", "Sat", "Sun"]          # keep only these weekdays
# earliest = "17:00"                         # keep only showtimes at/after this local time
# latest = "23:59"                           # keep only showtimes at/before this local time

# TMDB (themoviedb.org) supplies release dates, weekly popularity and ratings for the site's
# Newest / Popular this week / Top rated sorts, plus a backup poster. The weekly Action reads the
# token from the TMDB_TOKEN repository secret; without it the scrape still runs and keeps last
# week's TMDB data. Matching uses the title plus the year the theater gives (Sie, Landmark) or
# Fandango's release date. When it picks the wrong film, or none, add the normalized title here
# with the id from the film's themoviedb.org URL (themoviedb.org/movie/<id>-...).
[tmdb]
enabled = true

[tmdb.overrides]
"Ramayana" = 656908                 # 2026 release; a 1976 film has the exact title
"Dune: Part One" = 438631           # TMDB lists it as just "Dune"
"Friday The 13th Part 4" = 9730     # "Friday the 13th: The Final Chapter"
"The Scout" = 1403519               # 2026 location-scout film (Alamo, Dairy); a 1990 TV film has the title
"The Last Dive" = 1465979           # 2025 manta-ray documentary (Dairy); a 1992 film has the title
"Day of the Beast" = 10722          # Álex de la Iglesia's "The Day of the Beast" (1995), Dairy
"Little Women @dairy" = 39938       # the Dairy's is the 1933 Hepburn one; the Alamos show 2019's
# 0 = not on TMDB: an event that shares a film's name ("Title @theater" scopes any of these).
"Family Reunion" = 0                # Dairy: a night of Colorado filmmakers' short films

# Ratings (Metacritic via OMDb, key OMDB_API_KEY) are switched off: OMDb leaves most current
# releases unscored for weeks, so the site has no ratings or Top rated sort for now. Set
# enabled = true to collect Metascores again (the site would also need its display put back).
[omdb]
enabled = false
