# Configuration for the Denver showtimes scraper.
# Edit and re-run `python -m movie_scraper` (or let the daily GitHub Action run it).

timezone = "America/Denver"
days_ahead = 14                  # rolling window: today .. today + days_ahead
output = "public/data.json"      # where the frontend reads from
default_runtime_minutes = 120    # fallback event length when a film's runtime is unknown

[theaters.sie]
enabled = true
name = "Sie FilmCenter"
color = "#E4572E"                # used to color events in the calendar

[theaters.landmark]
enabled = true
name = "Landmark Mayan"
color = "#17BEBB"

[theaters.amc]
enabled = true
name = "AMC 9+CO 10"
color = "#2E5EAA"

# Title standardization: strip repertory/event series labels from the START of a
# film title (the label plus its ":" / "–" / "-" separator), so e.g.
# "Bleak Week: Gummo" -> "Gummo" and "Fan Faves: Michael" -> "Michael".
# Real titles with colons (e.g. "Star Wars: The Mandalorian and Grogu") are kept.
# Case-insensitive regex; TOML literal strings (single quotes) keep backslashes literal.
[titles]
strip_prefixes = [
  'Bleak Week',
  'Sie/?Saw',
  'Sci-?Fi Film Series(?:\s*#\d+)?',
  'Members?\s+Only[^:]*',
  'Fan Faves',
  'Staff Pick',
]
# Event descriptors stripped from the END of a title (label + separator).
# e.g. "Sleepaway Camp: The Midnight Mass Experience" -> "Sleepaway Camp".
strip_suffixes = [
  '\s+w/\s+.*$',
  ':\s+.*\bExperience$',
  '\s+Fan First Screenings?$',
]
# Titles matching any of these are dropped entirely — events that aren't a specific
# movie (mystery screenings, watch parties, etc.). Case-insensitive regex.
drop = [
  'Screen Unseen',
  'GOLAZO',
  'Watch Part(?:y|ies)',
  'Tokusatsu',
]

# Which films are pre-checked when the page first loads (others start unchecked but
# available to toggle on). Case-insensitive regex matched against the normalized title.
# Leave the list empty to pre-select ALL films (the long default). Edit to taste.
[defaults]
films = [
  'Backrooms',
  'I Love Boosters',
  'Tuner',
  'The Invite',
  'Disclosure Day',
]

# Optional filters. Omit/comment out a key to disable that filter.
# Leaving the whole section empty includes every showtime.
[filters]
# title_include = ["Dune", "Oppenheimer"]   # keep only titles matching any (case-insensitive) regex
# title_exclude = ["Sing-Along"]            # drop titles matching any regex
# weekdays = ["Fri", "Sat", "Sun"]          # keep only these weekdays
# earliest = "17:00"                         # keep only showtimes at/after this local time
# latest = "23:59"                           # keep only showtimes at/before this local time
