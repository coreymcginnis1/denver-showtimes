<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Denver Movie Showtimes</title>
  <meta name="description" content="Repertory, indie & first-run movie showtimes across Denver — filter by film and add any screening to your calendar. A companion to The Movie Newsletter." />

  <!-- Open Graph / preview card (used when this URL is pasted into Substack, etc.).
       __SITE_URL__ is replaced with the deployed Pages URL by the GitHub Action. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Denver Movie Showtimes" />
  <meta property="og:description" content="Repertory, indie & first-run movie showtimes across Denver — filter by film and add any screening to your calendar. A companion to The Movie Newsletter." />
  <meta property="og:url" content="__SITE_URL__" />
  <meta property="og:image" content="__SITE_URL__preview.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Denver Movie Showtimes</h1>
      <p class="subtitle">A companion to <a href="https://coreymcginnis.substack.com/" target="_blank" rel="noopener">The Movie Newsletter</a></p>
      <p class="updated" id="updated"></p>
    </header>

    <section class="controls" id="controls" aria-label="Filters">
      <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="false" aria-controls="controlsBody">Filters</button>
      <div class="controls-body" id="controlsBody">
        <div class="chips" id="theaterChips"></div>
        <div class="film-bar">
          <input type="search" id="filmSearch" placeholder="Search films…" autocomplete="off" />
          <button class="btn" id="picksBtn" type="button">Corey's picks</button>
          <button class="btn" id="selectAll" type="button">All films</button>
          <button class="btn" id="clearAll" type="button">None</button>
        </div>
        <div class="film-list" id="filmList"></div>
      </div>
    </section>

    <div id="calendar"></div>

    <footer>
      <p>Showtimes scraped from each theater for convenience — always confirm on the
        theater's site.</p>
      <p id="srcLinks"></p>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
  </div>

  <script src="app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
